version: 2
updates:
  # ── Root npm workspace (devDeps + headroom-ai runtime dep) ──────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore" # production deps  -> chore(deps): ...
      prefix-development: "chore" # dev deps         -> chore(deps-dev): ...
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    # Time-boxed exceptions. Each entry needs an `expires:` line matching a
    # constant in scripts/exception-expiry.mjs (EXCEPTIONS_EXPIRE or
    # SHORT_EXCEPTIONS_EXPIRE). Enforced by scripts/check-dependabot-ignores.mjs.
    # Once the date passes, the gate fails until the ignore is renewed or removed.
    ignore:
      # expires: 2026-11-01
      # @types/node tracks the Node major it describes, so the types must not
      # run ahead of the runtime we support. pi (@earendil-works/pi-coding-agent)
      # requires >=22.19.0, tests only on Node 22, and builds its release
      # binaries on Node 22 — so extensions can land on Node 22 in the wild.
      # Types from a later major would let tsc accept APIs absent there. Held at
      # the v22 line; revisit when pi raises its own engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # expires: 2026-09-08
      # Dev-only transitive under @commitlint/cli → ajv. Leaf fix is fast-uri
      # 3.1.5 (GHSA-7p8r-x3mc-p8w7); we are not force-bumping nested leaves.
      # Production audit (--omit=dev) is unaffected. Short hold; re-check
      # whether ajv/commitlint have moved by SHORT_EXCEPTIONS_EXPIRE.
      - dependency-name: "fast-uri"
      # expires: 2026-09-08
      # Dev-only transitive under @commitlint/cli → cosmiconfig and secretlint
      # → textlint/rc-config-loader. Leaf fix is js-yaml 4.3.1
      # (GHSA-5p4m-2wfm-xmqj). Same policy as fast-uri above.
      - dependency-name: "js-yaml"
      # expires: 2026-09-08
      # Dev-only transitive under vitest → vite → postcss. Leaf fix is nanoid
      # >=3.3.17 (GHSA-2v37-7h3g-55p8); postcss 8.5.26 already requires it,
      # but we are not force-bumping the nested chain. Same short hold.
      - dependency-name: "nanoid"
    labels:
      - "dependencies"

  # ── GitHub Actions (keep @v4-style tag pins current) ────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci" # -> ci(actions): ...
      include: "scope"
    groups:
      github-actions:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "github-actions"
